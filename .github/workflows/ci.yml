name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Check formatting (Spotless)
        run: ./gradlew spotlessCheck

      - name: Check code style (Checkstyle)
        run: ./gradlew checkstyleMain checkstyleTest

      - name: Lint front-end (ESLint)
        run: ./gradlew lintFrontend

  tests:
    name: Tests (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Unit tests
        run: ./gradlew test

      - name: Coverage report and verification
        run: ./gradlew jacocoTestReport jacocoTestCoverageVerification

      - name: Front-end tests (Vitest)
        run: ./gradlew testFrontend

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/jacoco/test/jacocoTestReport.xml,frontend/coverage/lcov.info
          flags: ${{ matrix.os }}
          fail_ci_if_error: true
